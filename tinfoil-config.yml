# Tinfoil Container Configuration — staging-vita-agent (staging debug enclave)
# Staging debug container for testing vita-agent changes before production.
# CI auto-updates the image field on every push to vita-agent staging branch.

cvm-version: 0.14.7
cpus: 2
memory: 8192

networks:
  public:
    # CVM >= 0.11 isolates containers by default (egress: closed). The service calls
    # Supabase, Tinfoil inference/attestation, Sentry and other HTTPS APIs.
    egress: open

containers:
  - name: vita-agent
    networks: [public]
    # cvm 0.14 defaults to a read-only rootfs; the agent writes DATA_DIR (/home/vita/.vita-agent) at import time.
    # Keeps the 0.7.5 behaviour; a tmpfs on the data dir could harden this later.
    read_only: false
    image: "ghcr.io/vitadao/vita-agent:staging-bd2623b75e8725610ea1c0fa3ccdf46c29dc5a91@sha256:b1096242e8a47e445df457ac63ab6931e508a541748a64db4fc8053259ffa725"
    env:
      # Staging-only inbound MCP. The grant key survives restarts through the
      # dedicated secret below; the API refuses this feature outside staging.
      - VITA_MCP_V1: "1"
      - VITA_MCP_PUBLIC_URL: "https://staging-vita-agent.debug.vitality-now.containers.tinfoil.dev/mcp"
      - STORAGE_BACKEND: "supabase"
      - SUPABASE_URL: "https://onqhfjiymokeljclyqdu.supabase.co"
      - SUPABASE_ANON_KEY: "sb_publishable_dfOtrN4XrFiQ2j_c2qp-TA_DK6xkOc0"
      # Staging machine-user identity is attached as STAGING_SUPABASE_INTERNAL_AUTH_*
      # secrets below — NOT inlined here. This repo is the PUBLIC attestation
      # anchor (that is its purpose), so anything written here is world-readable.
      # An earlier revision inlined the password on the belief that this was a
      # "private config repo"; it never was.
      #
      # The shared org SUPABASE_INTERNAL_AUTH_* secrets are still wrong for
      # staging — those point at prod Auth. config.py prefers the unprefixed pair
      # and falls back to the STAGING_ pair, so leaving the unprefixed names
      # unattached is what makes the staging identity take effect.
      # Turn-V2 capability identity + context-v2 bundle (mirror prod). Without these
      # build_capability_document() raises capability_identity_unavailable → the
      # /.well-known/vita-agent-capabilities endpoint 503s → the V2 client cannot
      # negotiate a turn → every chat fails with chat_agent_error. The 4 context-v2
      # flags are all-or-nothing (partial set → partial_context_v2_bundle).
      - VITA_AGENT_DEPLOYMENT_ID: "staging-vita-agent-bd2623b"
      - VITA_AGENT_POLICY_VERSION: "vita-agent-policy/2026-07-12"
      - VITA_CONTEXT_V2_COHORT_POLICY_VERSION: "context-v2-rollout/1"
      - VITA_TURN_ENVELOPE_V2: "1"
      - VITA_CONTEXT_OWNER_BACKEND: "1"
      - VITA_SESSION_V2: "1"
      - VITA_HEALTH_RESOLVER_V2: "1"
      # Without this the caps doc advertises turn_envelope_v2 but
      # context_v2_enabled_for_user() gates it to 0% of users (default). Prod=100.
      - VITA_CONTEXT_V2_CANARY_PERCENT: "100"
      - VITA_AGENT_ENABLE_LEGACY_ROUTES: "0"
      - VITA_ACTIVE_HEALTH_FOCUS_V1: "1"
      # Orchestrator v3 Slice A: project raw health evidence for the model and
      # tools. NO LONGER staging-only — enabled on prod 2026-07-26 in v0.14.141,
      # so this is now a shipped feature awaiting flag removal (see
      # vita-agent docs/plans/2026-07-25-open-issues.md B15).
      - VITA_HEALTH_PROJECTION_V1: "1"
      # VITA_SLEEP_EPISODE_V1 REMOVED 2026-07-26. It was a DEAD env var: nothing
      # in py/src ever read it, because the behaviour it once gated (Slice B,
      # episode-scoped sleep honesty) shipped unconditionally —
      # health/resolver.py `_EPISODE_FRESHNESS` / `_apply_episode_freshness`,
      # called with no flag check. Keeping it here also kept an
      # ALLOWED_MANIFEST_DELTA entry alive that told the release gate this was
      # an INTENTIONAL staging/prod divergence, which suppressed a real drift
      # signal in the one gate built to catch drift.
      # Orchestrator v3 Slice C: admit grant_catalog_v1 capability + inject
      # "# Authorized contexts" (C3). FE seal is C2; keep staging-only.
      - VITA_GRANT_CATALOG_V1: "1"
      # Reviewed staging rollout: VitaDAO/vita-agent#194. App flags, current
      # authority and explicit user review still gate execution. No wildcard.
      - VITA_APP_ACTION_PROPOSALS_V1: "1"
      - VITA_APP_ACTION_ENABLED_V1: "app.account.open_deletion,app.account_profile.update,app.account_profile.update_avatar,app.activity.delete_manual,app.activity.log_manual,app.activity.update_manual,app.biomarker.add_manual,app.biomarker.delete,app.biomarker.update,app.consent.open_settings,app.consent.set,app.health_calendar.add_event,app.health_calendar.apply_plan,app.health_calendar.attach_report,app.health_calendar.complete_event,app.health_calendar.create_group,app.health_calendar.delete_event,app.health_calendar.detach_report,app.health_calendar.edit_history,app.health_calendar.generate_plan,app.health_calendar.log_result,app.health_calendar.refine_plan,app.health_calendar.remove_group,app.health_calendar.rename_group,app.health_calendar.undo_plan,app.health_calendar.update_event,app.health_profile.update,app.lab_report.import,app.preferences.set_date_format,app.preferences.set_time_format,app.preferences.set_units,app.security.open_trusted_devices,app.staking.open_approve,app.staking.open_auto_renew,app.staking.open_stake,app.staking.open_withdraw,app.subscription.open_checkout,app.subscription.open_portal,app.vault.delete_report,app.vault.download_report,app.vault.export_data,app.wallet.open_link,app.wallet.open_unlink,app.wearable.connect,app.wearable.disconnect,app.wearable.open_sync_settings"
      # Staging conversational calendar acquisition: Agent PR #193, reviewed
      # unleased Manager SQL baseline accepted and rechecked 2026-09-21.
      # App acquisition enablement/rebuild and user acceptance remain separate.
      - VITA_AGENT_MANAGER_CHECKPOINTS: "1"
      - VITA_SERVER_HEALTH_PACK_V1: "1"
      - VITA_APP_ACTION_TARGET_ACQUISITION_V1: "1"
      # Paired App #464/#465; immutable compatibility gate: Agent #201.
      - VITA_APP_ACTION_TARGET_ACQUISITION_V2: "1"
      - VITA_APP_ACTION_TARGET_ACQUISITION_DB_READY: "1"
      - VITA_FULL_HEALTH_SESSION_V1: "1"
      - VITA_AGENT_EXACT_MATCH: "1"
      - OPENAI_AGENTS_DISABLE_TRACING: "1"
      - VITA_AGENT_ENCLAVE_URL: "https://staging-vita-agent.debug.vitality-now.containers.tinfoil.dev/"
      - VITA_AGENT_REQUIRE_SEALED_DEK: "1"
      - VITA_AGENT_JSON_LOGS: "1"
      - VITA_AGENT_PROVIDER_HEALTH_DIAGNOSTICS: "1"
      - SENTRY_ENVIRONMENT: "staging"
      # Admits source="synthetic_fixture" health facts so the release gate can
      # assert on KNOWN values ("no pill number outside the seeded set" — the
      # check that would have caught the fabricated ApoB 95). Safe to leave on:
      # config.py:188 requires this AND SENTRY_ENVIRONMENT=="staging", so
      # copying the line into the prod manifest leaves it inert (probed
      # 2026-07-26). contracts.py:391 still enforces closed-set provenance and
      # the registry's unit/type/range rules on every synthetic fact.
      - VITA_STAGING_SYNTHETIC_FIXTURES: "1"
      - SENTRY_RELEASE: "vita-agent@bd2623b"
      - VITA_AGENT_VERSION: "vita-agent@bd2623b"
      - SENTRY_TRACES_SAMPLE_RATE: "0.1"
      - SUPABASE_JWT_VERIFY_MODE: "jwks"
      - SUPABASE_JWKS_URL: "https://onqhfjiymokeljclyqdu.supabase.co/auth/v1/.well-known/jwks.json"
      - VITA_AGENT_AUTO_EXTRACT: "1"
      - VITA_AGENT_JOB_AUTORUN: "1"
      # V2 post-turn jobs (memory extraction, compaction) are scheduled by every
      # chat turn; without this they are never claimed (VitaDAO/vita-agent#247).
      - VITA_AGENT_JOB_V2: "1"
      # Chat runs Phala deepseek/deepseek-v4.1-flash-1017 (served by Tinfoil) through
      # Phala's attested gateway with end-to-end encryption. Phala mode forbids
      # crossing to another provider and requires no generation retries (the default
      # is 0). Voice stays on Privatemode Whisper.
      - VITA_AGENT_MODEL_PROVIDER: "phala"
      - VITA_AGENT_MODEL: "deepseek/deepseek-v4.1-flash-1017"
      - VITA_AUDIO_PROVIDER: "privatemode"
      # Restores headroom the model call used to have. Before 2026-08-05 there
      # was no explicit timeout, so the OpenAI SDK defaults applied: 600s and
      # 2 retries. DEFAULT_MODEL_REQUEST_TIMEOUT_S=60 / retries=0 arrived in a
      # WIP preservation commit (ac65f5d, "not verified green ... not a quality
      # claim") with no rationale recorded, and neither environment overrode
      # it. Measured on this workload: warm heavy turns run 25-48s and a
      # holistic ask took 68s, so 60s sits INSIDE the normal working range and
      # any slowness (cold model, extra tool round) becomes a dead turn with no
      # retry to absorb it. 120 is MAX_MODEL_REQUEST_TIMEOUT_S, the ceiling the
      # code itself enforces, and the value the local rig has always used.
      - VITA_AGENT_MODEL_TIMEOUT_S: "120"
      # The DeepSeek V4.1 model card recommends 1.0. At 0 the model repeats an
      # invalid tool call verbatim, one wasted round each time (measured 2026-10-22).
      - VITA_AGENT_CHAT_TEMPERATURE: "1.0"
      # Pinned rather than inherited, so the deployed ceiling is auditable from
      # the attestation anchor. Units are estimated tokens (UTF-8 JSON bytes/2),
      # about 2.1x real tokens. The model serves 262,144 real tokens: the hard
      # ceiling is that window minus the 8,000-token completion (~121K real).
      # The soft budget triggers recall compaction; 48,000 summarized long
      # sessions that fit the window comfortably (replays, 2026-10-06).
      - VITA_AGENT_MODEL_INPUT_BUDGET: "100000"
      - VITA_AGENT_MODEL_INPUT_HARD_CEILING: "254000"
      # Past-conversation search: advertises conversation_history_v1 so the app
      # grants history access and the model can search and read the user's own
      # earlier chats (VitaDAO/vita-agent#253).
      - VITA_CONVERSATION_HISTORY_V1: "1"
      # MEASURED 2026-08-20, do not set this to "0" without re-measuring.
      # The lever is now honoured on V2 (vita-agent dd9dbb7). Turning
      # thinking OFF fixes the empty-terminal (manager_output_invalid) but
      # costs more than it saves on this manager: the same
      # data+literature prompt went 46s/4 rounds WITH 4 PubMed citations
      # -> 92s/6 rounds with ZERO citations, still asserting "STRONG
      # evidence from large cohort studies". Ungrounded evidence claims
      # are a worse failure than a rare retryable one.
      - VITA_AGENT_CHAT_THINKING: "auto"
      # THINKING-OFF tier. This is the cap the turn actually runs under
      # when thinking is off, so it is not a chit-chat tier. Left at its 1300
      # default it starved a plain "how many workouts this month?": the
      # answer hit finish=length every round, the agent kept spending
      # rounds, and the turn blew past MODEL_TIMEOUT_S=120 and vanished
      # (measured on staging 2026-08-20, 139s, no terminal). Removing the
      # reasoning preamble does not shrink the ANSWER — it still needs the
      # full allowance. A cap is a ceiling, not a target.
      - VITA_AGENT_CHAT_MAX_TOKENS_LIGHT: "6000"
      # Aligned to prod 2026-07-25 so staging is a faithful stand-in. The
      # release gate (py/bench/release_gate.py --stage config) found staging
      # and prod disagreeing on exactly the surfaces chat work touches, which
      # is why "verified on staging" did not imply "correct in prod".
      # NOTE: the LOW/LIGHT/THINK_BUDGET overrides prod carried were STALE
      # (below the code defaults that replaced them) and were removed from
      # prod rather than copied here.
      - VITA_AGENT_PARALLEL_TOOLS: "1"
      # Public web search through Exa (vita-agent #297). Needs the
      # VITA_AGENT_EXA_API_KEY secret below; images without #297 ignore it.
      # Staging only until the ai_insights consent text covers web search.
      - VITA_AGENT_WEB_SEARCH: "1"
      # Literature is direct Firecrawl (FIRECRAWL_API_KEY below), the only provider.
    secrets:
      - STAGING_VITA_MCP_GRANT_PRIVATE_KEY
      - VITA_AGENT_GHCR_TOKEN
      - TINFOIL_API_KEY
      - PHALA_API_KEY
      - PRIVATEMODE_API_KEY
      - SENTRY_DSN
      # Staging Supabase URL/anon live in env above (onqhf…). Do NOT attach the
      # shared org SUPABASE_* secrets — those are prod (cuvsz…) and override the
      # staging values (jobs PGRST301 / JWT mismatch). The staging machine-user
      # identity comes from these STAGING_-prefixed secrets, which config.py
      # reads as its fallback pair.
      - STAGING_SUPABASE_INTERNAL_AUTH_EMAIL
      - STAGING_SUPABASE_INTERNAL_AUTH_PASSWORD
      # Backs /api/v1/turn-protocol-ticket (exposed in shim.paths). Already ATTACHED
      # to the enclave; declared here so a create --replace can't silently drop it.
      - VITA_PROTOCOL_TICKET_HMAC_KEY
      # Agent-owned Exa key for web search. Not EXA_API_KEY: that org secret
      # belongs to aubrai-harness-prod.
      - VITA_AGENT_EXA_API_KEY
      - FIRECRAWL_API_KEY

shim:
  upstream-port: 8787
  paths:
    - /mcp
    - /api/v1/mcp/info
    - /api/health
    - /.well-known/enclave-pubkey
    - /.well-known/vita-agent-capabilities
    - /.well-known/vita-agent-turn-features
    - /api/v1/turn-protocol-ticket
    - /api/v1/audio/transcriptions
    - /api/v1/capsule
    - /api/v1/jobs
    - /api/v1/jobs/*
