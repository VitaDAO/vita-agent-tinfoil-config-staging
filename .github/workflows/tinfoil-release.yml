# Dashboard entrypoint from tinfoilsh/tinfoil-containers-template, with staging guards.
name: Tinfoil Release

run-name: Release ${{ inputs.version }}

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-release-prepare-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare-release:
    if: github.repository == 'VitaDAO/vita-agent-tinfoil-config-staging' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: true # Needed only to push the release tag below.
      - run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-checks.txt
      - run: .venv/bin/python scripts/validate_config.py
      - run: .venv/bin/python -m unittest discover -s tests -v
      - name: Create and push the release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
          existing="$(git ls-remote --tags origin "refs/tags/$VERSION")"
          if [[ -n "$existing" ]]; then
            echo "::error::Tag $VERSION already exists. Resume its publish workflow; do not overwrite it."
            exit 1
          fi
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
      - name: Dispatch the publish workflow on the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: gh workflow run tinfoil-release-publish.yml --repo "$GH_REPO" --ref "$VERSION"
